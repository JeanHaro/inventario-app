<!-- ================================
  REPORTES
================================ -->
<div class="reports">
  <!-- ================================
    CABECERA
  ================================ -->
  <div class="reports__header">
    <h2>{{ periodTitle() }}</h2>

    <!-- SELECTS -->
    <div class="reports__select">
      <shared-select
        [options]="periodOptions"
        [width]="'14rem'"
        [value]="selectedPeriod()"
        (valueChange)="updatePeriod($event)"
      />
      <shared-select
        [options]="categoryOptions"
        [value]="selectedCategory()"
        (valueChange)="updateCategory($event)"
      />
    </div>
  </div>
  <!-- END: CABECERA -->

  <!-- ================================
    KPIS
  ================================ -->
  <div class="reports__kpis">
    @for (
      kpi of kpis();
      track selectedCategory() + '-' + selectedPeriod() + '-' + kpi.label;
      let i = $index;
    ) {
      <kpi-card
        [style.animation-delay.ms]="i * 80"
        [label]="kpi.label"
        [value]="kpi.value"
        [unit]="kpi.unit ?? ''"
        [trend]="kpi.trend ?? null"
        [icon]="kpi.icon ?? null"
      />
    }
  </div>
  <!-- END: KPIS -->

  <!-- ================================
    CHARTS
  ================================ -->
  <div class="reports__charts">

    @for (
      chart of charts();
      track selectedCategory() + '-' + selectedPeriod() + '-' + chart.title;
      let i = $index
    ) {
      <!-- CHART -->
      <div
        class="reports__chart"
        [class.reports__chart--wide]="chart.type === 'bar'"
        [class.reports__chart--extra-wide]=" chart.type === 'line'"
        [style.animation-delay.ms]="i * 80"
      >
        <h4>{{ chart.title }}</h4>

        <kpi-chart
          [type]="chart.type"
          [labels]="chart.data.labels"
          [values]="chart.data.values"
          [label]="chart.title"
          radius="65%"
        />
      </div>
    }

  </div>
  <!-- END: CHARTS -->

</div>
<!-- END: REPORTES -->
